[build-system]
requires      = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name    = "meidem"
dynamic = ["version"]
description = "Multi-grid Epic Interpolator for limb DarkEning Models"
readme      = "README.md"
license     = {file = "LICENSE"}
requires-python = ">=3.9"

authors = [
    { name = "Icaro Meidem", email = "seu_email@exemplo.com" }
]

keywords = [
    "astronomy", "limb darkening", "stellar atmosphere",
    "transit", "TESS", "Kepler", "exoplanets"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.21",
    "pandas>=1.5",
    "scipy>=1.8",
    "pyarrow>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "build",
    "twine",
]

[project.urls]
Homepage      = "https://github.com/icaromeidem/meidem"
Repository    = "https://github.com/icaromeidem/meidem"
"Bug Tracker" = "https://github.com/icaromeidem/meidem/issues"

# ── Configuração do pacote ─────────────────────────────────────
# Estrutura esperada:
#   ~/Documentos/meidem/          ← pyproject.toml está aqui
#       meidem/                   ← pacote Python
#           __init__.py
#           _version.py
#           grids/
#           tables/
#               kostogryz2022/
#               claret2022/
#               claret2017/
#               claret2011/

[tool.setuptools.packages.find]
where     = ["."]         
include   = ["meidem*"]  
[tool.setuptools.package-data]
"meidem" = [
    "tables/**/*.parquet",
    "tables/*/*.parquet",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
[tool.setuptools_scm]
write_to = "meidem/_version.py" 