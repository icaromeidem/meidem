name: Publish to PyPI

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Increment version
      run: |
        python << 'PYTHON_SCRIPT'
        import re
        
        # Lê o arquivo
        with open('pyproject.toml', 'r') as f:
            content = f.read()
        
        # Extrai versão atual
        match = re.search(r'version\s*=\s*"(\d+\.\d+\.(\d+))"', content)
        if match:
            current = match.group(1)
            patch = int(match.group(2))
            
            # Incrementa patch
            new_version = current.replace(str(patch), str(patch + 1))
            
            # Substitui
            new_content = content.replace(f'version = "{current}"', f'version = "{new_version}"')
            
            with open('pyproject.toml', 'w') as f:
                f.write(new_content)
            
            print(f"Version updated: {current} → {new_version}")
            
            # Salva pra usar depois
            with open('version.txt', 'w') as f:
                f.write(new_version)
        PYTHON_SCRIPT

    - name: Read version
      id: version
      run: echo "NEW_VERSION=$(cat version.txt)" >> $GITHUB_OUTPUT

    - name: Commit version change
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions@github.com"
        git add pyproject.toml
        git commit -m "chore: bump version to ${{ steps.version.outputs.NEW_VERSION }}" || echo "No changes to commit"
        git push || echo "Nothing to push"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/*