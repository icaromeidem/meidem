name: Publish to PyPI

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Necessário para contar commits

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Increment version
      run: |
        # Lê a versão atual
        VERSION=$(grep "version" pyproject.toml | head -1 | grep -oP '\d+\.\d+\.\d+')
        echo "Versão atual: $VERSION"
        
        # Incrementa patch (1.0.0 → 1.0.1)
        NEW_VERSION=$(python -c "v='$VERSION'.split('.'); print(f'{v[0]}.{v[1]}.{int(v[2])+1}')")
        echo "Nova versão: $NEW_VERSION"
        
        # Substitui no pyproject.toml
        sed -i "s/version = \"$VERSION\"/version = \"$NEW_VERSION\"/" pyproject.toml
        
        # Salva pra usar depois
        echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

    - name: Commit version change
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions@github.com"
        git add pyproject.toml
        git commit -m "chore: bump version to ${{ env.NEW_VERSION }}"
        git push

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/*
