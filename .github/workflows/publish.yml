name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update version in pyproject.toml and _version.py
        run: |
          python - <<'EOF'
          import re, pathlib, os
          version = os.environ["VERSION"]

          # atualiza pyproject.toml
          p = pathlib.Path("pyproject.toml")
          content = p.read_text()
          content = re.sub(r'^version\s*=\s*"[^"]+"', f'version = "{version}"', content, flags=re.MULTILINE)
          p.write_text(content)

          # atualiza _version.py
          v = pathlib.Path("meidem/_version.py")
          v.write_text(f'__version__ = "{version}"\n')

          print(f"✓ versão atualizada para {version}")
          EOF
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}

      - name: Confirm versions
        run: |
          grep '^version' pyproject.toml
          cat meidem/_version.py

      - name: Build package
        run: python -m build

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*